# Copyright 2026 Query Farm LLC - https://query.farm
#
# Unit tests (pytest), lint, and the sqllogictest extension suite
# (test/sql/*.test) run against the vgi-translate worker through the real signed
# `vgi` DuckDB community extension via a prebuilt standalone `haybarn-unittest`.
# See ci/README.md for the design.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  pull_request:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The SQL test runner, pinned; its haybarn 2.0 community `vgi` extension speaks
  # the worker's VGI protocol (vgi.v3).
  HAYBARN_VERSION: "2.0.1rc3"

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      # Runs the full suite. The single real en->es translation test
      # (tests/test_translate.py) downloads an Argos package; it self-skips if
      # the download is unavailable, so CI stays green offline.
      - name: Run tests
        run: uv run pytest -q

  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.14"
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Check linting
        run: uv run ruff check .

      - name: Type check (mypy)
        run: uv run mypy vgi_translate translate_worker.py

      # Run pydoclint in an isolated env (uvx): the dev venv also contains
      # vgi-rpc's `docstring-parser`, which collides with pydoclint's required
      # `docstring-parser-fork` in the shared `docstring_parser` import namespace.
      - name: Docstring lint (pydoclint)
        run: uvx pydoclint --config pyproject.toml vgi_translate translate_worker.py

  # Metadata-quality gate: build the worker, then run the vgi-lint metadata
  # linter (catalog/schema/function descriptions, examples, support tags, …).
  # Kept as a separate job so its result is visible at a glance.
  metadata-quality:
    name: Metadata quality (vgi-lint)
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.14"
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install the worker
        run: uv sync --all-extras --python 3.14

      - name: vgi-lint
        uses: Query-farm/vgi-lint-check@v2
        with:
          # Lint the worker via the project venv's Python, NOT `uv run
          # translate_worker.py`: the PEP 723 script env `uv run` builds caches an
          # SDK independently of the synced venv and can emit the pre-0.16 catalog
          # schema, producing a false ATTACH/schema mismatch. `uv sync --all-extras`
          # (above) puts the current SDK in `.venv`.
          location: ".venv/bin/python translate_worker.py"
          fail-on: info

  # test/sql/*.test through DuckDB (the haybarn-unittest runner + the signed
  # community `vgi` extension) over every transport, via ci/run-integration.sh —
  # the same script `make test-sql` runs.
  integration:
    name: SQL E2E (${{ matrix.transport }}) on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # launch: DuckDB starts the worker once on an AF_UNIX socket and pools it.
        transport: [stdio, launch, http]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.14"
      - name: Build the worker
        run: uv sync --locked --all-extras
      # The real-translation E2E cases need the Argos en->es (and, for the composed
      # examples, es->en) packages in the user data home. detect_lang E2E is
      # offline and always runs.
      - name: Pre-install Argos en->es and es->en packages
        run: |
          uv run python scripts/ensure_argos_pair.py en es
          uv run python scripts/ensure_argos_pair.py es en
      - name: Install the SQL test runner
        run: |
          uv venv .tools
          uv pip install -p .tools "haybarn-unittest==${HAYBARN_VERSION}"
      - name: Run test/sql over ${{ matrix.transport }}
        run: |
          export WORKER="$PWD/.venv/bin/vgi-translate-worker"
          export HAYBARN_UNITTEST="$PWD/.tools/bin/haybarn-unittest"
          TRANSPORT=${{ matrix.transport }} ci/run-integration.sh
