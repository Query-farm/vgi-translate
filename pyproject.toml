[project]
name = "vgi-translate"
version = "0.1.0"
description = "A VGI worker bringing local neural machine translation and language detection into DuckDB/SQL"
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
authors = [{ name = "Query Farm" }]
keywords = ["vgi", "duckdb", "translation", "nmt", "argos", "nlp"]
dependencies = [
    "vgi-python>=0.46.1",
    "argostranslate>=1.9",
    "py3langid>=0.4",
]

[project.scripts]
# Console entry DuckDB's `vgi` extension can spawn over stdio, and the target of
# `bin/vgi-translate-worker`. HTTP mode is served via `vgi-serve
# vgi_translate.worker:TranslateWorker --http` (from the `serve` extra).
vgi-translate-worker = "vgi_translate.worker:main"

[project.urls]
Repository = "https://github.com/Query-farm/vgi-translate"
Issues = "https://github.com/Query-farm/vgi-translate/issues"

[project.optional-dependencies]
# HTTP transport: the worker can serve over HTTP (`translate_worker.py --http`) in
# addition to stdio. That path needs vgi-python's `http` extra (waitress).
# CI's http transport leg installs this via `uv sync --extra http`.
http = [
    "vgi-python[http]>=0.46.1",
]
# HTTP-serving extra installed by the Docker image (`pip install '.[serve]'`).
# Alias of `http`: pulls in vgi-python[http] so `vgi-serve ... --http` works.
serve = [
    "vgi-python[http]>=0.46.1",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
    "pyarrow-stubs",
    # NOTE: pydoclint is intentionally NOT listed here. It depends on
    # `docstring-parser-fork`, which installs the same top-level `docstring_parser`
    # import package as the real `docstring-parser` that `vgi-rpc` imports at
    # module load. Co-installing both leaves a broken `docstring_parser/` and the
    # worker fails to import. CI (and `make lint` guidance) run pydoclint isolated
    # via `uvx pydoclint` so it never enters this venv. See CLAUDE.md.
]

# vgi-python is distributed on PyPI as `vgi-python`. For local development
# against an in-tree checkout, uncomment the source override below (or set
# `UV_INDEX` / use `uv pip install -e ../vgi-python`).
# [tool.uv.sources]
# vgi-python = { path = "../vgi-python", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vgi_translate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Heavy tests that need to download an Argos language package are marked
# `download`; skip them with `-m "not download"` (and CI auto-skips when offline).
markers = [
    "download: requires installing an Argos language package (network on first run)",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "D"]

[tool.ruff.lint.per-file-ignores]
# Docstrings (D) are enforced on the worker package/script (product code), not tests.
"tests/**" = ["D"]
"conftest.py" = ["D"]
"scripts/**" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"

[tool.pydoclint]
# Docstring consistency gate (complements ruff's D rules: ruff checks docstring
# shape, pydoclint checks documented args/returns/attrs match the code).
style = "google"
arg_type_hints_in_docstring = false
check_return_types = false
check_yield_types = false
check_class_attributes = true
skip_checking_raises = true
allow_init_docstring = true

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# Genuinely untyped third-party libraries (no stubs published).
module = ["argostranslate.*", "py3langid.*"]
ignore_missing_imports = true
